<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>静夜思 — 想我的可爱露珠</title>
  <style>
    :root{--bg:#fff8ef;--card:#fff;--accent:#c67a3f;--muted:#6b6b6b}
    html,body{height:100%;}
    body{
      margin:0;padding:0;min-height:100%;
      display:flex;align-items:center;justify-content:center;
      background: radial-gradient(circle at 10% 10%, rgba(198,122,63,0.06), transparent 10%),
                  linear-gradient(180deg,#fff8ef 0%, #fffefc 100%);
      font-family: "Noto Serif SC", "Songti SC", "STSong", SimSun, serif;
      color:#3c2f2a;
      -webkit-font-smoothing:antialiased;
    }
    .card{
      width:min(760px,92%);
      background:var(--card);
      border-radius:16px;box-shadow:0 10px 30px rgba(60,47,42,0.09);
      padding:48px 40px;box-sizing:border-box;
      border:1px solid rgba(198,122,63,0.06);
    }
    header{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
    .title{font-size:28px;color:var(--accent);font-weight:600}
    .subtitle{font-size:12px;color:var(--muted)}
    .poem{
      margin-top:14px;padding:28px 30px;background:linear-gradient(180deg, rgba(246,239,229,0.6), rgba(255,255,255,0.4));
      border-radius:12px;border:1px solid rgba(198,122,63,0.05);
      text-align:center;
    }
    .poem p{margin:12px 0;font-size:28px;line-height:1.8}
    .poem p.cn{font-weight:600}
    .sig{margin-top:20px;text-align:right;font-size:14px;color:var(--muted)}
    footer{margin-top:18px;font-size:12px;color:var(--muted);display:flex;justify-content:space-between;align-items:center}
    .seal{display:inline-block;background:var(--accent);color:#fff;padding:6px 12px;border-radius:999px;font-weight:700}
    @media (max-width:480px){.poem p{font-size:20px;padding:0}}
  </style>
</head>
<body>
  <div class="card" role="main">
    <header>
      <div>
        <div class="title">静夜思</div>
        <div class="subtitle">唐 · 李白</div>
      </div>
      <div class="seal">想我的可爱露珠</div>
    </header>

    <article class="poem" aria-label="静夜思">
      <p class="cn">床前明月光，</p>
      <p class="cn">疑是地上霜。</p>
      <p class="cn">举头望明月，</p>
      <p class="cn">低头思故乡。</p>

      <div class="sig">—— 想我的可爱露珠</div>
    </article>

    <footer>
      <div>静静的夜，清冷的月。</div>
      <div>保存为 <code>jingyesi.html</code> 并在浏览器打开</div>
    </footer>
  </div>
</body>
</html>
